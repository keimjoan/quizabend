/* ---------- Online: Kameras ----------
   Jeder im Online-Spiel kann seine Kamera einschalten. Die Bilder gehen per WebRTC direkt von Browser zu Browser,
   jeder mit jedem, ohne Ton und in kleiner Auflösung. Über den Raum laufen nur die Verbindungsdaten
   (Ereignis 'rtc' mit Empfänger 'to', Spiel 'g'), in der Präsenz steht 'cam: 1'. Kostenlose STUN-Server helfen beim
   Verbinden. Ohne TURN-Server klappt es in manchen Netzen nicht, dann steht „Keine Verbindung“ auf dem Bild. */
const RTC_ICE = Array.isArray(window.QUIZ_ICE) ? window.QUIZ_ICE : [{ urls: ['stun:stun.cloudflare.com:3478', 'stun:stun.l.google.com:19302'] }];
const CAM_OK = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.RTCPeerConnection);
const CAM_BITRATE = 200000, CAM_WIDTH = 320, CAM_FPS = 15;
const cam = { stream: null, busy: false, pcs: new Map(), err: '' };
let camEl = null;

const camGame = () => on.role === 'host' ? (on.og ? on.og.id : null) : on.role === 'player' ? on.gid : null;
const camMe = () => { const p = peers.find(x => x.isMe); return p ? p.peer : ''; };
const camPeers = gid => peers.filter(p => !p.isMe && !p.sameTab && p.presence && p.presence.game === gid && (p.presence.role === 'ohost' || p.presence.role === 'oplayer'));

/* Fehlermeldung zum Einschalten, bleibt sichtbar, bis es klappt oder die Kamera wieder versucht wird */
function camErrText(e) {
  const n = e && e.name;
  if (n === 'NotAllowedError' || n === 'SecurityError' || n === 'PermissionDeniedError')
    return 'Die Kamera ist für diese Seite gesperrt. Klicke in der Adressleiste links auf das Schloss- oder Kamerasymbol, erlaube die Kamera und versuch es noch einmal. Am Handy steht das in den Einstellungen des Browsers.';
  if (n === 'NotFoundError' || n === 'DevicesNotFoundError' || n === 'OverconstrainedError') return 'Dieses Gerät hat keine Kamera, die der Browser benutzen kann.';
  if (n === 'NotReadableError' || n === 'TrackStartError' || n === 'AbortError')
    return 'Die Kamera ist gerade belegt, zum Beispiel von Zoom, Teams oder einem anderen Browser-Tab. Schließe das und versuch es noch einmal.';
  return `Die Kamera lässt sich nicht einschalten${n ? ` (${n})` : ''}.`;
}
async function camToggle() {
  if (cam.busy) return;
  if (cam.stream) { camStop(); return; }
  if (!CAM_OK) {
    cam.err = window.isSecureContext === false ? 'Die Kamera geht nur über eine sichere Adresse (https), zum Beispiel https://keimjoan.github.io/quizabend/.'
      : 'Dieser Browser kann keine Kamerabilder verschicken. Nimm einen aktuellen Chrome, Edge, Firefox oder Safari.';
    render(); return;
  }
  cam.busy = true; cam.err = ''; render();
  // Die Kamera in ihrer Grundeinstellung öffnen, verkleinert wird erst beim Senden (camLimit).
  // Wünsche nach kleiner Auflösung oder wenig Bildern lassen manche Kameras in Chrome hängen
  // (Logitech StreamCam: „Timeout starting video source“ nach 10 Sekunden). Gesperrt bleibt gesperrt.
  const asks = [{ audio: false, video: { facingMode: 'user' } }, { audio: false, video: true }];
  let err = null;
  for (const a of asks) {
    try { cam.stream = await navigator.mediaDevices.getUserMedia(a); err = null; break; }
    catch (e) { err = e; cam.stream = null; if (e && /NotAllowed|Security|PermissionDenied/.test(e.name)) break; }
  }
  if (err) cam.err = camErrText(err);
  cam.busy = false;
  if (cam.stream && !camGame()) { camStop(); return; }
  if (cam.stream) for (const c of cam.pcs.values()) camAddTracks(c);
  updatePresence(true); camSync(); render();
}
function camStop() {
  if (!cam.stream) return;
  for (const c of cam.pcs.values()) for (const s of c.pc.getSenders()) if (s.track) { try { c.pc.removeTrack(s); } catch (e) { /* schon zu */ } }
  cam.stream.getTracks().forEach(t => t.stop());
  cam.stream = null;
  updatePresence(true); camSync(); render();
}
/* Nur VP8: hält die Verbindungsdaten klein (unter 4 KiB pro Nachricht) */
function camAddTracks(c) {
  for (const t of cam.stream.getVideoTracks()) {
    const s = c.pc.addTrack(t, cam.stream);
    const tr = c.pc.getTransceivers().find(x => x.sender === s);
    try {
      const vp8 = RTCRtpReceiver.getCapabilities('video').codecs.filter(x => /vp8/i.test(x.mimeType));
      if (tr && vp8.length && tr.setCodecPreferences) tr.setCodecPreferences(vp8);
    } catch (e) { /* Browser kann das nicht, dann eben alle Formate */ }
  }
}
function camLimit(pc) {
  for (const s of pc.getSenders()) {
    if (!s.track) continue;
    try {
      const p = s.getParameters();
      if (!p.encodings || !p.encodings.length) continue;
      const e = p.encodings[0], w = Number(s.track.getSettings().width) || CAM_WIDTH;
      const scale = Math.max(1, Math.round(w / CAM_WIDTH * 100) / 100);
      if (e.maxBitrate === CAM_BITRATE && e.scaleResolutionDownBy === scale) continue;
      // Klein verschicken, egal wie groß die Kamera filmt
      Object.assign(e, { maxBitrate: CAM_BITRATE, scaleResolutionDownBy: scale, maxFramerate: CAM_FPS });
      s.setParameters(p).catch(() => {});
    } catch (e) { /* egal */ }
  }
}

/* Verbindet sich mit jedem im selben Spiel, sobald einer von beiden die Kamera an hat. Schickt nur, wer eine Kamera hat. */
function camSync() {
  const gid = camGame(), meId = camMe(), want = new Set();
  if (!gid && cam.stream) { cam.stream.getTracks().forEach(t => t.stop()); cam.stream = null; }
  if (gid && CAM_OK && meId && roomNs) for (const p of camPeers(gid)) if (cam.stream || p.presence.cam) want.add(p.peer);
  for (const [id, c] of cam.pcs) if (!want.has(id) || c.gid !== gid) camDrop(id);
  for (const id of want) if (!cam.pcs.has(id)) camConnect(id, gid);
  camDraw();
}
function camDrop(id) {
  const c = cam.pcs.get(id); if (!c) return;
  cam.pcs.delete(id);
  try { c.pc.close(); } catch (e) { /* schon zu */ }
}
/* „Perfekte Verhandlung“ nach WebRTC-Muster: Beide Seiten dürfen anbieten, bei einer Kollision gibt die höfliche nach. */
function camConnect(id, gid) {
  const pc = new RTCPeerConnection({ iceServers: RTC_ICE });
  const c = { pc, gid, polite: camMe() > id, making: false, ignore: false, stream: null, state: 'new', q: Promise.resolve() };
  c.send = data => { if (roomNs) roomNs.emit('rtc', Object.assign({ g: gid, to: id }, data)).catch(() => {}); };
  cam.pcs.set(id, c);
  pc.onicecandidate = e => { if (e.candidate) c.send({ c: e.candidate.toJSON() }); };
  pc.onnegotiationneeded = async () => {
    try { c.making = true; await pc.setLocalDescription(); c.send({ d: pc.localDescription.toJSON() }); }
    catch (e) { /* nächster Versuch beim nächsten Anlass */ }
    finally { c.making = false; }
  };
  pc.onsignalingstatechange = () => { if (pc.signalingState === 'stable') camLimit(pc); };
  pc.ontrack = e => {
    c.stream = e.streams[0] || new MediaStream([e.track]);
    e.track.onunmute = camDraw; e.track.onmute = camDraw; e.track.onended = camDraw;
    camDraw();
  };
  pc.onconnectionstatechange = () => {
    c.state = pc.connectionState;
    if (c.state === 'failed' && pc.restartIce) pc.restartIce();
    camDraw();
  };
  if (cam.stream) camAddTracks(c);
  return c;
}
function onRtc(msg) {
  if (!msg || msg.isMe || msg.sameTab) return;
  const d = msg.data, gid = camGame();
  if (!d || typeof d !== 'object' || !gid || d.g !== gid || d.to !== camMe() || typeof msg.peer !== 'string') return;
  let c = cam.pcs.get(msg.peer);
  if (!c) {
    if (!d.d || d.d.type !== 'offer' || !CAM_OK || !camPeers(gid).some(p => p.peer === msg.peer)) return;
    c = camConnect(msg.peer, gid);
  }
  // Nachrichten einer Verbindung strikt nacheinander abarbeiten
  c.q = c.q.then(() => camSignal(c, d)).catch(() => {});
}
async function camSignal(c, d) {
  const pc = c.pc;
  if (pc.signalingState === 'closed') return;
  if (d.d && (d.d.type === 'offer' || d.d.type === 'answer') && typeof d.d.sdp === 'string') {
    const collide = d.d.type === 'offer' && (c.making || pc.signalingState !== 'stable');
    c.ignore = !c.polite && collide;
    if (c.ignore) return;
    await pc.setRemoteDescription(d.d);
    if (d.d.type === 'offer') { await pc.setLocalDescription(); c.send({ d: pc.localDescription.toJSON() }); }
  } else if (d.c && typeof d.c === 'object') {
    try { await pc.addIceCandidate(d.c); } catch (e) { if (!c.ignore) throw e; }
  }
}

/* Name und Lampenfarbe zu einer Spieler-ID, wie auf der Tafel */
function camWho(pid, fallback) {
  const v = on.view, pl = (v && v.pl) || [], i = pl.findIndex(p => p[0] === pid), p = pl[i];
  if (!p) return { n: fallback || '…', c: 'var(--ink-dim)', i: 99 };
  let c = 'var(--ink-dim)';
  if (v.ph === 'lobby') { if (v.set.mode === 'teams') { if (p[2] != null && COLORS[p[2]]) c = COLORS[p[2]].hex; } else c = OCOLORS[i % OCOLORS.length]; }
  else if (p[2] != null && v.teams && v.teams[p[2]]) c = col(v.teams[p[2]][1]);
  return { n: p[1], c, i };
}
/* Die Kamerabilder liegen in einem festen Element, das nach jedem Neuzeichnen in #cam-slot wandert.
   So laufen die Videos weiter und werden nicht bei jedem Klick neu aufgebaut. */
function camDraw() {
  if (!camEl) { camEl = document.createElement('div'); camEl.className = 'cams'; camEl.setAttribute('role', 'group'); camEl.setAttribute('aria-label', 'Kameras'); }
  const gid = camGame(), tiles = [];
  if (gid && cam.stream) tiles.push({ key: 'me', stream: cam.stream, who: camWho(me.pid, me.name), me: true, state: 'connected' });
  if (gid) for (const [id, c] of cam.pcs) {
    const p = peers.find(x => x.peer === id);
    if (p && p.presence && p.presence.cam) tiles.push({ key: id, stream: c.stream, who: camWho(p.presence.pid, p.presence.name), state: c.state });
  }
  tiles.sort((a, b) => a.who.i - b.who.i);
  const old = new Map([...camEl.children].map(el => [el.dataset.key, el]));
  tiles.forEach((t, n) => {
    let el = old.get(t.key); old.delete(t.key);
    if (!el) {
      el = document.createElement('figure'); el.className = 'cam'; el.dataset.key = t.key;
      el.innerHTML = '<video autoplay playsinline muted></video><span class="camwait"></span><figcaption><span class="lamp"></span><span class="nm"></span></figcaption>';
    }
    const vid = el.querySelector('video');
    if (vid.srcObject !== (t.stream || null)) vid.srcObject = t.stream || null;
    el.style.setProperty('--c', t.who.c);
    el.classList.toggle('me', !!t.me);
    el.querySelector('.nm').textContent = t.who.n + (t.me ? ' (du)' : '');
    const live = !!t.stream && t.stream.getVideoTracks().some(x => x.readyState === 'live' && !x.muted);
    el.querySelector('.camwait').textContent = live ? '' : t.state === 'failed' ? 'Keine Verbindung' : 'Verbindet …';
    if (camEl.children[n] !== el) camEl.insertBefore(el, camEl.children[n] || null);
  });
  for (const el of old.values()) el.remove();
  camEl.style.setProperty('--n', Math.max(1, tiles.length));
  const slot = tiles.length ? document.getElementById('cam-slot') : null;
  if (slot) { if (camEl.parentNode !== slot) slot.appendChild(camEl); }
  else if (camEl.parentNode) camEl.remove();
  for (const v of camEl.querySelectorAll('video')) if (v.srcObject && v.paused) v.play().catch(() => {});
}
/* Knopf zum Ein- und Ausschalten der eigenen Kamera: groß in der Lobby, klein in der Kopfzeile des Spiels */
function camBtn(big) {
  if (!roomNs) return '';
  const onNow = !!cam.stream, label = cam.busy ? 'Kamera startet …' : onNow ? 'Kamera ausschalten' : 'Kamera einschalten';
  return `<button class="btn btn-plain${big ? '' : ' btn-sm camtog'}${onNow ? ' lit' : ''}" id="${big ? 'o-cam' : 't-cam'}" data-act="cam" aria-pressed="${onNow}" ${cam.busy ? 'disabled' : ''}>${icon(onNow ? 'cam' : 'camoff')} ${label}</button>`;
}
const camErrHTML = () => cam.err ? `<p class="err camerr" id="cam-err" role="alert">${esc(cam.err)} <button class="btn btn-plain btn-sm" data-act="cam-err-x">Schließen</button></p>` : '';

/* ---------- Online: Spieler ---------- */
const INPUT_KEYS = { team: null, pick: null, ans: null, pass: null, vote: null, nx: null, claim: null, buzz: null };
function ensureUniquePid() {
  if (peers.some(p => !p.sameTab && p.presence && p.presence.role === 'ohost' && p.presence.pid === me.pid)) {
    me.pid = rid(10);
    try { sessionStorage.setItem('quizabend.tabpid', me.pid); } catch (e) { /* egal */ }
  }
}
function oJoin(gid) {
  const name = cleanName(me.name);
  if (!name) { on.err = 'Bitte gib zuerst deinen Namen ein.'; render(); const el = $('#me-name'); if (el) el.focus(); return; }
  if (!roomNs || !gid) return;
  ensureUniquePid();
  me.name = name; saveMe();
  Object.assign(on, { role: 'player', gid, og: null, view: null, at: Date.now(), tEnd: null, draft: '', sent: '', myVote: null, myCounter: null, err: '', stale: false });
  lastScores = null; ui.mode = 'online';
  window.scrollTo(0, 0);
  render();
  lastPresence = '';
  roomNs.presence(Object.assign({ role: 'oplayer', game: gid, pid: me.pid, name, label: null, ph: null, np: null, pids: null, info: null }, INPUT_KEYS)).catch(() => {});
}
function oLeave() {
  if (on.role === 'host') store.set(K.online, null);
  const wasPlayer = on.role === 'player';
  Object.assign(on, { role: null, gid: null, og: null, view: null, at: 0, tEnd: null, draft: '', sent: '', myVote: null, myCounter: null, stale: false });
  ui.mode = 'setup'; prefs.tab = 'online'; savePrefs();
  if (roomNs && wasPlayer) roomNs.presence(Object.assign({}, INPUT_KEYS)).catch(() => {});
  render(); updatePresence(true);
}
function oAct(kind, val) {
  if (on.role === 'host') {
    const g = on.og; if (!g) return;
    const snap = JSON.stringify(g);
    oInput(me.pid, { [kind]: val });
    if (JSON.stringify(g) !== snap) oBump(); else render();
    return;
  }
  if (on.role !== 'player' || !roomNs) return;
  roomNs.presence({ [kind]: val }).catch(() => toast('Das hat nicht geklappt. Bitte nochmal versuchen.'));
  const mark = on.sent;
  if (mark) setTimeout(() => { if (on.sent === mark) { on.sent = ''; render(); } }, 6000);
  render();
}
function oPrepareFlip(prev, v) {
  if (v && v.cur && (!prev || !prev.cur || prev.cur.qn !== v.cur.qn)) {
    const el = document.getElementById(`tile-${v.cur.c}-${v.cur.r}`);
    flipFrom = el ? el.getBoundingClientRect() : null;
  }
}
function onOState(msg) {
  if (!msg || msg.sameTab || on.role !== 'player') return;
  const d = msg.data;
  if (!d || typeof d !== 'object' || d.g !== on.gid || !d.v || typeof d.v !== 'object' || typeof d.v.ver !== 'number') return;
  const v = d.v, prev = on.view;
  on.at = Date.now();
  on.tEnd = v.cur && typeof v.cur.tl === 'number' ? Date.now() + v.cur.tl : null;
  const wasStale = on.stale; on.stale = false;
  if (prev && v.id === prev.id && v.ver === prev.ver) { if (wasStale) render(); else tickTimer(); return; }
  if (prev && v.id === prev.id && v.ver < prev.ver) return;
  if (v.cur && (!prev || !prev.cur || prev.cur.qn !== v.cur.qn)) on.draft = '';
  on.view = v;
  oPrepareFlip(prev, v);
  oSounds(prev, v);
  render();
}
function oSounds(prev, v) {
  if (!prev || !v || prev.id !== v.id) return;
  const pc = prev.cur, c = v.cur;
  if (c && (!pc || pc.qn !== c.qn)) sfx.pick();
  else if (c && pc) {
    if (c.st === 'buzz' && pc.st !== 'buzz') sfx.open();
    if (c.st === 'answer' && pc.st === 'buzz') sfx.buzz(c.at || 0);
    (c.ans || []).forEach((a, i) => { const was = pc.ans && pc.ans[i] ? pc.ans[i][3] : null; if (was == null && a[3] === 1) sfx.right(); else if (was == null && a[3] === 0) sfx.wrong(); });
  }
  if (v.ph !== prev.ph && (v.ph === 'boardEnd' || v.ph === 'gameEnd')) sfx.fanfare();
  if (v.ph === 'gameEnd' && prev.ph !== 'gameEnd' && Array.isArray(v.sc) && Array.isArray(v.teams)) {
    const top = Math.max(...v.sc);
    confetti(v.teams.filter((_, i) => v.sc[i] === top).map(t => col(t[1])).concat(['#f2e9d3', '#e3b04b']));
  }
}

/* ---------- Online: Ansichten ---------- */
function onlineHTML() {
  const v = on.view;
  if (!v) return `<main class="lobby"><header class="lobby-head"><h1>Verbinden</h1><span class="spacer"></span><button class="btn btn-plain" data-act="o-leave">Abbrechen</button></header>
    <div class="panel"><p>Verbinde mit dem Spiel. Das dauert meist nur einen Moment.</p>${on.stale ? '<p class="err">Der Gastgeber antwortet nicht. Vielleicht wurde das Spiel gerade beendet.</p>' : ''}</div></main>`;

      body += `<div class="votebtns"><button class="btn btn-good btn-lg" id="o-yes" data-act="o-vote" data-ok="1" aria-pressed="${mv === true}">${icon('check')} Zählt als richtig</button>
        <button class="btn btn-bad btn-lg" id="o-no" data-act="o-vote" data-ok="0" aria-pressed="${mv === false}">${icon('x')} Zählt nicht</button></div>`;
    } else body += `<p class="lead">Die anderen stimmen jetzt ab, ob ${teams ? 'eure' : 'deine'} Antwort zählt.</p>`;
    body += `<p class="tally">${c.nv} von ${c.ne} ${c.ne === 1 ? 'Stimme' : 'Stimmen'} abgegeben. Bei mindestens der Hälfte für richtig gibt es ${c.v} Punkte, sonst werden ${c.v} Punkte abgezogen.</p>${timer}`;
  } else {
    who = '<span class="turnpill" style="--c:var(--ink-dim)"><span class="lamp"></span>Aufgelöst</span>';
    body += `${solution}<div class="verdicts">${ans.map(a => {
      const votes = (a[4] + a[5]) ? `, ${a[4]} zu ${a[5]} Stimmen` : '';
      const byKi = a[7] != null;
      const res = byKi || v.set.mod ? (a[3] === 1 ? ['ok', 'richtig'] : ['no', 'falsch']) : a[3] === 1 ? ['ok', `zählt${votes}`] : a[2] === 0 ? ['no', a[1] ? 'selbst als falsch gewertet' : 'falsch'] : ['no', `abgelehnt${votes}`];
      return `<div class="verdict"><span class="lamp" style="--c:${T(a[0]).c}"></span><span class="who">${by(a)}</span><span class="what">${a[1] ? '„' + esc(a[1]) + '“' : 'keine Antwort'}</span><span class="res ${res[0]}">${res[1]}</span>${byKi && a[7] ? `<span class="kinote">KI-Spielleiter: ${esc(a[7])}</span>` : ''}</div>`;
    }).join('') || '<p class="hint">Niemand hat geantwortet.</p>'}</div>`;
    foot = `<p class="result">${c.win >= 0 ? `<b>${esc(T(c.win).n)}</b> holt ${c.v} Punkte.` : 'Diesmal hat niemand die Punkte geholt.'}</p><span class="spacer"></span>
      <button class="btn btn-brass btn-lg" id="o-next" data-act="o-next" ${on.sent === 'xq' + qn ? 'disabled' : ''}>Weiter</button>`;
  }
  const log = Array.isArray(c.log) && c.log.length ? `<div class="log">${c.log.map(([t, dl]) => `<span class="logchip"><span class="lamp" style="--c:${T(t).c}"></span>${esc(T(t).n)} <span class="d ${dl > 0 ? 'plus' : dl < 0 ? 'minus' : ''}">${dl ? fmtDelta(dl) : 'ohne Abzug'}</span></span>`).join('')}</div>` : '';
  return `<section class="qcard online ${flipFrom ? 'enter' : ''}">
    <header class="qhead"><span class="qcat">${esc((v.cats || [])[c.c] || '')}</span>${flaps(c.v)}<span class="sr">${c.v} Punkte</span><span class="qwho">${who}</span></header>
    <div class="qbody">${body}${log}</div>${foot ? `<footer class="qfoot">${foot}</footer>` : ''}
  </section>`;
}
function oBoardEndHTML(v, T) {
  return `<section class="interlude">
    <h2 class="bigline">Board ${v.bi + 1} ist leer</h2>
    <p class="lead">Zwischenstand nach ${v.bi + 1} von ${v.bn} Boards. Auf dem nächsten Board fängt ${esc(T(v.turn).n)} an.</p>

function oGameEndHTML(v) {

  return `<section class="finale" style="--c:${w.color}">

}
function oScoresHTML(v, myT, T) {
  const teams = v.set.mode === 'teams', c = v.cur;
  return `<footer class="scores" aria-label="Punktestand">${(v.teams || []).map((_, i) => {
    const t = T(i), mem = (v.pl || []).filter(p => p[2] === i);
    const curT = v.ph === 'question' && c ? (c.st === 'answer' ? c.at : (c.st === 'judge' || c.st === 'vote' || c.st === 'ki') && c.ans[c.vi] ? c.ans[c.vi][0] : null) : null;
    const active = (v.ph === 'board' && v.turn === i) || curT === i;
    const offline = mem.length > 0 && mem.every(p => !p[3]);
    const tried = v.ph === 'question' && c && c.st === 'buzz' && (c.att || []).includes(i);
    const state = teams ? mem.map(p => `${esc(p[1])}${p[0] === me.pid ? ' (du)' : ''}${p[3] ? '' : ' (weg)'}`).join(', ')
      : (offline ? 'nicht verbunden' : (v.ph === 'board' && v.turn === i ? 'am Zug' : ''));
    const s = Number(v.sc && v.sc[i]) || 0;
    return `<div class="team${active ? ' turn' : ''}${myT === i ? ' mine' : ''}${offline || tried ? ' out' : ''}" style="--c:${t.c}">
      <span class="lamp"></span><span class="tname">${esc(t.n)}${!teams && myT === i ? ' <small>(du)</small>' : ''}</span><span class="tkey">${teams ? `${mem.length} Spieler` : ''}</span>
      <span class="tscore" data-score="${i}">${flaps(fmt(s))}<span class="sr">${fmt(s)} Punkte</span></span>
      <span class="tstate">${state}</span></div>`;

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (ui.help && !e.target.closest('.helpmenu')) helpToggle(false);
  if (e.target.classList && e.target.classList.contains('modal-back')) { closeModal(); return; }
  if (!el || el.disabled) return;
  const act = el.dataset.act, i = Number(el.dataset.i);
  if (ui.keyCapture >= 0 && act !== 'team-key') ui.keyCapture = -1;
  const catsChanged = () => { savePrefs(); if (ui.mode === 'online' && on.role === 'host') oBump(); else render(); };
  switch (act) {
    case 'tab': prefs.tab = el.dataset.v === 'local' ? 'local' : 'online'; savePrefs(); render(); break;
    case 'help-menu': helpToggle(!ui.help); break;
    case 'help': helpToggle(false); openHelp(el.dataset.v); break;
    case 'cats-fold': ui.catsOpen = !ui.catsOpen; render(); break;
    /* Einrichtung */
    case 'team-add': {
      if (prefs.teams.length >= MAX_TEAMS) break;
      const usedC = new Set(prefs.teams.map(t => t.color)), usedK = new Set(prefs.teams.map(t => t.key));
      prefs.teams.push({ name: '', color: COLORS.findIndex((_, c) => !usedC.has(c)), key: KEYS.find(k => !usedK.has(k)) || 'x' });
      savePrefs(); render();
      const inp = document.getElementById(`tn-${prefs.teams.length - 1}`); if (inp) inp.focus();
      break;
    }
    case 'team-remove': if (prefs.teams.length > 2) { prefs.teams.splice(i, 1); savePrefs(); render(); } break;
    case 'team-color': {
      const used = new Set(prefs.teams.filter((_, j) => j !== i).map(t => t.color));
      let c = prefs.teams[i].color;
      for (let k = 0; k < COLORS.length; k++) { c = (c + 1) % COLORS.length; if (!used.has(c)) break; }
      prefs.teams[i].color = c; savePrefs(); render(); break;
    }
    case 'team-key': ui.keyCapture = ui.keyCapture === i ? -1 : i; render(); break;
    case 'cat-toggle': {
      const id = el.dataset.id, off = new Set(prefs.off);
      if (off.has(id)) off.delete(id); else off.add(id);
      prefs.off = [...off]; catsChanged(); break;
    }
    case 'cat-all': prefs.off = []; catsChanged(); break;
    case 'cat-none': prefs.off = poolAll().map(c => c.id); catsChanged(); break;
    case 'timer': prefs.timer = Number(el.dataset.v); savePrefs(); render(); break;
    case 'penalty': prefs.penalty = el.dataset.v === '1'; savePrefs(); render(); break;
    case 'sound': prefs.sound = el.dataset.v === '1'; savePrefs(); render(); break;
    case 'boards': {
      const r = boardRange();
      prefs.boards = clamp(clamp(prefs.boards, r.min, r.max) + Number(el.dataset.d), r.min, r.max); savePrefs(); render(); break;
    }
    case 'start': startGame(); break;
    case 'resume': game = savedGame; savedGame = null; lastScores = null; ui.mode = 'game'; render(); updatePresence(); broadcastState(); break;
    case 'discard': confirmBox('Spiel verwerfen?', 'Der gespeicherte Spielstand wird gelöscht.', 'Verwerfen', () => { savedGame = null; store.set(K.game, null); render(); }); break;
    case 'open-editor': ui.mode = 'editor'; if (!custom.find(c => c.id === ui.editSel)) ui.editSel = custom.length ? custom[0].id : null; render(); window.scrollTo(0, 0); break;
    /* Eigene Fragen */
    case 'ed-close': store.set(K.custom, custom); ui.mode = 'setup'; render(); window.scrollTo(0, 0); break;
    case 'ed-new': newCustom(); break;
    case 'ed-sel': ui.editSel = el.dataset.id; render(); break;
    case 'ed-del': {
      const c = custom.find(x => x.id === ui.editSel); if (!c) break;
      confirmBox('Kategorie löschen?', `„${c.name.trim() || 'Ohne Namen'}“ wird mit allen Fragen gelöscht.`, 'Löschen', () => {
        const k = custom.indexOf(c); custom.splice(k, 1);
        prefs.off = prefs.off.filter(x => x !== c.id); savePrefs();
        ui.editSel = custom.length ? custom[Math.min(k, custom.length - 1)].id : null;
        store.set(K.custom, custom); render();
      });
      break;
    }
    case 'ed-import': openImport(); break;
    case 'ed-export': openExport(); break;
    /* Eigene Boards */
    case 'ownb-import': openBoardImport(); break;
    case 'bimp-run': if (importBoards()) catsChanged(); break;
    case 'ownb-toggle': { const b = ownBoards.find(x => x.id === el.dataset.id); if (b) { b.on = !b.on; saveBoards(); catsChanged(); } break; }
    case 'ownb-del': {
      const b = ownBoards.find(x => x.id === el.dataset.id); if (!b) break;
      confirmBox('Board löschen?', `„${b.name}“ wird mit allen Fragen aus diesem Browser gelöscht.`, 'Löschen', () => { ownBoards = ownBoards.filter(x => x !== b); saveBoards(); catsChanged(); });
      break;
    }
    case 'imp-run': {
      const ta = $('#imp-text'), err = $('#imp-err');
      try {
        const list = parseImport(ta.value);
        custom.push(...list); ui.editSel = list[0].id; store.set(K.custom, custom);
        closeModal(); render();
        toast(list.length === 1 ? 'Eine Kategorie importiert' : `${list.length} Kategorien importiert`);
      } catch (ex) { err.textContent = ex.message; }
      break;
    }
    case 'copy-link': {
      const link = roomLink();
      try { navigator.clipboard.writeText(link).then(() => toast('Link kopiert'), () => toast(link)); } catch (ex) { toast(link); }
      break;
    }
    case 'exp-copy': {
      const ta = $('#exp-text');
      const fallback = () => { ta.focus(); ta.select(); toast('Text ist markiert. Jetzt mit Strg+C kopieren.'); };
      try { navigator.clipboard.writeText(ta.value).then(() => toast('Kopiert'), fallback); } catch (ex) { fallback(); }
      break;
    }
    /* Spiel an einem Bildschirm */
    case 'pick': dispatch({ type: 'pick', c: Number(el.dataset.c), r: Number(el.dataset.r) }); break;
    case 'judge': dispatch({ type: 'judge', ok: el.dataset.ok === '1' }); break;
    case 'buzz': dispatch({ type: 'buzz', t: Number(el.dataset.t) }); break;
    case 'reveal': case 'next': case 'cancel': case 'nextBoard': case 'undo': dispatch({ type: act }); break;
    case 'toggle-sound': prefs.sound = !prefs.sound; savePrefs(); render(); break;
    case 'fullscreen': toggleFullscreen(); break;
    case 'menu': openMenu(); break;
    case 'phone-info': openPhoneInfo(); break;
    case 'edit-scores': closeModal(); scoreEditor(game.teams, game.dyn.scores, 'scores-save'); break;
    case 'scores-save': { const s = readScores(game.dyn.scores); closeModal(); dispatch({ type: 'scores', s }); break; }
    case 'end-game': closeModal(); confirmBox('Spiel beenden?', 'Die restlichen Fragen werden nicht mehr gespielt. Es zählt der aktuelle Punktestand.', 'Jetzt auswerten', () => dispatch({ type: 'end' })); break;
    case 'new-setup-ask': closeModal(); confirmBox('Neues Spiel einrichten?', 'Das laufende Spiel wird beendet und der Punktestand gelöscht.', 'Neues Spiel', leaveGame); break;
    case 'new-setup': leaveGame(); break;
    case 'rematch': startGame(); break;
    /* Dialoge */
    case 'modal-close': closeModal(); break;
    case 'modal-ok': { const f = modalOk; closeModal(); if (f) f(); break; }
    /* Spielleitung am Handy */
    case 'remote-join': joinRemote(el.dataset.game); break;
    case 'remote-leave': leaveRemote(); break;
    /* Online */
    case 'o-create': oCreate(); break;
    case 'o-join': oJoin(el.dataset.game); break;
    case 'o-resume': if (savedOnline) oResume(savedOnline); break;
    case 'o-discard': confirmBox('Online-Spiel beenden?', 'Das gespeicherte Online-Spiel wird gelöscht.', 'Beenden', () => { savedOnline = null; store.set(K.online, null); render(); }); break;
    case 'o-leave': oLeaveAsk(); break;
    case 'cam': camToggle(); break;
    case 'cam-err-x': cam.err = ''; render(); break;
    case 'o-leave-ask': closeModal(); oLeaveAsk(); break;
    case 'o-set': oSet(el.dataset.k, ['mode', 'km', 'wert'].includes(el.dataset.k) ? el.dataset.v : Number(el.dataset.v)); break;
    case 'o-mod': { const c = on.view && on.view.cur; if (!c) break; on.sent = `m${c.qn}-${c.vi}`; oAct('mod', { q: c.qn, i: c.vi, ok: el.dataset.ok === '1' }); break; }
    case 'ki-check': kiCheck(); break;
    case 'ki-clear': kiSave('', false); kiErr = ''; render(); break;
    case 'o-team': oAct('team', Number(el.dataset.t)); break;
    case 'o-start': oStartGame(); break;
    case 'o-lobby': oBackToLobby(); break;
    case 'o-lobby-ask': closeModal(); confirmBox('Zurück in die Lobby?', 'Das laufende Spiel wird abgebrochen. Alle bleiben in der Lobby.', 'Zur Lobby', oBackToLobby); break;
    case 'o-pick': { const v = on.view; if (!v) break; const c = Number(el.dataset.c), r = Number(el.dataset.r); on.sent = 'k' + v.qn; oAct('pick', { q: v.qn, c, r }); break; }
    case 'o-skip': { const c = on.view && on.view.cur; if (!c) break; const k = (c.ans || []).length; on.sent = `a${c.qn}-${k}`; oAct('ans', { q: c.qn, k, t: '', skip: true }); break; }
    case 'o-claim': { const c = on.view && on.view.cur; if (!c) break; on.sent = `j${c.qn}-${c.vi}`; oAct('claim', { q: c.qn, i: c.vi, ok: el.dataset.ok === '1' }); break; }
    case 'o-buzz': { const c = on.view && on.view.cur; if (!c) break; on.sent = `b${c.qn}-${c.br}`; oAct('buzz', { q: c.qn, n: c.br }); break; }
    case 'o-pass': { const c = on.view && on.view.cur; if (!c) break; on.sent = `p${c.qn}-${c.br}`; oAct('pass', { q: c.qn, n: c.br }); break; }
    case 'o-vote': { const c = on.view && on.view.cur; if (!c) break; const ok = el.dataset.ok === '1'; on.myVote = { q: c.qn, i: c.vi, ok }; oAct('vote', { q: c.qn, i: c.vi, ok }); break; }
    case 'o-next': {
      const v = on.view; if (!v) break;
      const k = v.ph === 'boardEnd' ? 'e' + v.qn : (v.cur && v.cur.st === 'resolved' ? 'q' + v.cur.qn : '');
      if (!k) break;
      on.sent = 'x' + k; oAct('nx', { k }); break;
    }
    case 'o-menu': oOpenMenu(); break;
    case 'o-scores': closeModal(); if (on.og && on.og.teams.length) scoreEditor(on.og.teams.map(t => ({ name: t.n, color: t.c })), on.og.sc, 'o-scores-save'); break;
    case 'o-scores-save': { const g = on.og; if (!g) break; g.sc = readScores(g.sc); closeModal(); oBump(); break; }
    case 'o-end': closeModal(); confirmBox('Spiel beenden?', 'Die restlichen Fragen werden nicht mehr gespielt. Es zählt der aktuelle Punktestand.', 'Jetzt auswerten', () => { const g = on.og; if (g && (g.ph === 'board' || g.ph === 'boardEnd')) { g.ph = 'gameEnd'; g.cur = null; oBump(); } }); break;
  }
});

document.addEventListener('input', e => {
  const el = e.target, k = el.dataset && el.dataset.input; if (!k) return;
  if (k === 'team-name') { const t = prefs.teams[Number(el.dataset.i)]; if (t) { t.name = el.value.slice(0, 30); savePrefs(); } return; }
  if (k === 'me-name') { me.name = el.value.slice(0, 20); saveMe(); if (on.err) { on.err = ''; const er = $('#me-err'); if (er) er.textContent = ''; } return; }
  if (k === 'o-draft') { on.draft = el.value.slice(0, 80); return; }
  if (k === 'ki-key') { kiDraft = el.value.slice(0, 300); return; }
  if (k === 'ki-keep') { kiKeep = !!el.checked; return; }
  if (k === 'o-tname') {
    const g = on.og; if (!g || g.ph !== 'lobby') return;
    g.set.tn[Number(el.dataset.i)] = el.value.slice(0, 24);
    prefs.oset.tn = g.set.tn.slice(0, 6); savePrefs();
    clearTimeout(oTnT); oTnT = setTimeout(oBump, 500);
    return;
  }
  const c = custom.find(x => x.id === ui.editSel); if (!c) return;
  if (k === 'ed-name') c.name = el.value.slice(0, 60);
  else if (k === 'ed-q') c.qs[Number(el.dataset.r)].q = el.value;
  else if (k === 'ed-a') c.qs[Number(el.dataset.r)].a = el.value;
  saveCustom(); updateEdItem(c);
});

document.addEventListener('submit', e => {
  const f = e.target.closest && e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const c = on.view && on.view.cur; if (!c) return;
  const t = cleanAnswer(on.draft);
  if (!t) { toast('Bitte zuerst eine Antwort eintippen.'); const inp = $('#o-ans-in'); if (inp) inp.focus(); return; }
  const k = (c.ans || []).length;
  on.sent = `a${c.qn}-${k}`;
  on.draft = '';
  oAct('ans', { q: c.qn, k, t });
});

document.addEventListener('change', e => {
  if (e.target.id === 'bimp-file' && e.target.files && e.target.files[0]) { readBoardFile(e.target.files[0]); return; }
  if (e.target.id !== 'imp-file' || !e.target.files || !e.target.files[0]) return;
  e.target.files[0].text().then(t => { const ta = $('#imp-text'); if (ta) ta.value = t; }).catch(() => { const err = $('#imp-err'); if (err) err.textContent = 'Die Datei ließ sich nicht lesen.'; });
});

document.addEventListener('keydown', e => {
  sfx.unlock();
  if (ui.keyCapture >= 0 && ui.mode === 'setup') {
    if (e.key === 'Tab') { ui.keyCapture = -1; render(); return; }
    e.preventDefault();
    if (e.key === 'Escape') { ui.keyCapture = -1; render(); return; }
    const k = e.key.toLowerCase();
    if (k.length === 1 && /[a-z0-9äöü]/.test(k)) {
      const i = ui.keyCapture, other = prefs.teams.findIndex((t, j) => j !== i && t.key === k);
      if (other >= 0) prefs.teams[other].key = prefs.teams[i].key;
      prefs.teams[i].key = k; ui.keyCapture = -1; savePrefs(); render();
      if (other >= 0) toast(`Taste mit ${teamLabel(prefs.teams[other])} getauscht`);
    }
    return;
  }
  if (e.key === 'Escape') {
    if (ui.help) { helpToggle(false); const b = $('#help-btn'); if (b) b.focus(); return; }
    closeModal(); return;
  }
  const peek = e.target.closest && e.target.closest('[data-hold="peek"]');
  if (peek && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); setPeek(true); return; }
  if (isTyping(e.target) || $('#modal-root').innerHTML) return;
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
    if (ui.mode === 'game' || ui.mode === 'remote') { e.preventDefault(); dispatch({ type: 'undo' }); }
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if (ui.mode === 'game' && game && game.dyn.phase === 'question' && game.dyn.cur.st === 'buzz') {
    const k = e.key.toLowerCase(), t = game.teams.findIndex(x => x.key === k);
    if (t < 0) return;
    e.preventDefault();
    if (eligible(game).includes(t)) dispatch({ type: 'buzz', t });
    else toast(`${game.teams[t].name} hat schon geantwortet`);
  }
});
document.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') setPeek(false); });
document.addEventListener('pointerdown', e => {
  sfx.unlock();
  if (e.target.closest && e.target.closest('[data-hold="peek"]')) setPeek(true);
});
['pointerup', 'pointercancel', 'blur'].forEach(t => window.addEventListener(t, () => setPeek(false)));
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('[data-hold]')) e.preventDefault(); });
function setPeek(onx) { const p = $('#peek-pop'); if (p) p.hidden = !onx; }

/* =========================================================
   Verbindung (Raum von Claude oder eigener Raum-Server): Spielleitung am Handy und Online-Spiel
   ========================================================= */
let roomNs = null, roomOk = false, roomState = 'none', peers = [], lastPresence = '';
const remote = { game: null, view: null, at: 0, pending: false, tEnd: null };
const PKEYS = ['role', 'game', 'label', 'ph', 'np', 'pids', 'info', 'pid', 'name', 'cam'];

/* ---------- Eigener Raum-Server (Ordner server/, läuft bei Cloudflare) ----------
   Jeder Raum hat einen Code, der hinten im Link steht (…/quizabend/#k3x9p2). Wer den Link hat, ist im selben Raum.
   Ohne Code im Link nimmt die Seite den zuletzt benutzten oder würfelt einen neuen. */
let roomCodeNow = '';
const okRoomCode = s => typeof s === 'string' && /^[a-z0-9]{4,16}$/.test(s);
function hashRoomCode() { try { return decodeURIComponent(location.hash.slice(1)).trim().toLowerCase(); } catch (e) { return ''; } }
function roomCode() {
  let c = hashRoomCode();
  if (!okRoomCode(c)) c = store.get(K.room);
  if (!okRoomCode(c)) c = rid(6);
  store.set(K.room, c);
  if (location.hash !== '#' + c) { try { history.replaceState(null, '', '#' + c); } catch (e) { /* egal */ } }
  return (roomCodeNow = c);
}
const roomLink = () => location.href.split('#')[0] + '#' + roomCodeNow;
addEventListener('hashchange', () => {
  const c = hashRoomCode();
  if (!roomCodeNow || c === roomCodeNow) return;
  if (okRoomCode(c)) { store.set(K.room, c); location.reload(); }
  else { try { history.replaceState(null, '', '#' + roomCodeNow); } catch (e) { /* egal */ } }
});

/* Bietet dieselben Funktionen wie der Raum von Claude (emit, on, presence, onPeers, onConnection)
   und verbindet sich nach Abbrüchen selbst neu. */
function webRoom(url) {
  const myId = rid(12), handlers = {}, peerFns = [], connFns = [];
  const peerMap = new Map();
  let ws = null, ok = false, mine = {}, tries = 0, lastMsg = 0, timer = null;
  const bytes = s => new TextEncoder().encode(s).length;
  const setPeer = (id, p, at) => peerMap.set(id, { presence: Object.freeze(p && typeof p === 'object' ? p : {}), updatedAt: at || Date.now() });
  setPeer(myId, {});
  const snap = () => [...peerMap].map(([id, v]) => Object.freeze({ peer: id, by: null, isMe: id === myId, sameTab: id === myId, kind: 'viewer', guest: false, presence: v.presence, updatedAt: v.updatedAt }));
  const call = (fns, x) => fns.slice().forEach(fn => { try { fn(x); } catch (e) { console.error(e); } });
  const notify = (joined, left, updated) => {
    if (!joined.length && !left.length && !updated.length) return;
    const ps = snap(), pick = ids => ps.filter(p => ids.includes(p.peer));
    call(peerFns, { peers: ps, joined: pick(joined), left: left.map(id => ({ peer: id, presence: {} })), updated: pick(updated) });
  };
  const setOk = v => { if (ok !== v) { ok = v; call(connFns, v); } };
  const send = m => { if (!ws || ws.readyState !== 1) return false; ws.send(JSON.stringify(m)); return true; };
  const off = (list, fn) => () => { const i = list.indexOf(fn); if (i >= 0) list.splice(i, 1); };

  function onMsg(ev) {
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (!m || typeof m !== 'object') return;
    lastMsg = Date.now();
    if (m.t === 'hi') {
      tries = 0;
      const list = (Array.isArray(m.peers) ? m.peers : []).filter(p => p && typeof p.id === 'string' && p.id !== myId);
      const now = new Set(list.map(p => p.id)), joined = [], left = [], updated = [];
      for (const id of [...peerMap.keys()]) if (id !== myId && !now.has(id)) { peerMap.delete(id); left.push(id); }
      for (const p of list) { (peerMap.has(p.id) ? updated : joined).push(p.id); setPeer(p.id, p.p, p.at); }
      send({ t: 'presence', p: mine });
      notify(joined, left, updated);
      setOk(true);
    } else if (m.t === 'peer' && typeof m.id === 'string' && m.id !== myId) {
      const had = peerMap.has(m.id);
      setPeer(m.id, m.p, m.at);
      notify(had ? [] : [m.id], [], had ? [m.id] : []);
    } else if (m.t === 'leave' && typeof m.id === 'string' && m.id !== myId) {
      if (peerMap.delete(m.id)) notify([], [m.id], []);
    } else if (m.t === 'emit' && typeof m.topic === 'string') {
      call(handlers[m.topic] || [], { topic: m.topic, data: m.data, peer: m.from, by: null, isMe: false, sameTab: false, kind: 'viewer', guest: false });
    }
  }
  function connect() {
    clearTimeout(timer); timer = null;
    let sock;
    try { sock = new WebSocket(`${url}?id=${myId}`); } catch (e) { retry(); return; }
    ws = sock; lastMsg = Date.now();
    sock.onmessage = e => { if (ws === sock) onMsg(e); };
    sock.onclose = () => { if (ws !== sock) return; ws = null; setOk(false); retry(); };
  }
  function retry() { clearTimeout(timer); timer = setTimeout(connect, Math.min(15000, 500 * 2 ** tries++) + Math.random() * 500); }
  function drop() { const s = ws; ws = null; try { s.close(); } catch (e) { /* egal */ } setOk(false); retry(); }
  const wake = () => { if (!ws) connect(); };
  addEventListener('online', wake);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
  // Lebenszeichen alle 25 Sekunden. Kommt eine Minute lang nichts zurück, neu verbinden.
  setInterval(() => {
    if (!ws || ws.readyState !== 1) return;
    if (Date.now() - lastMsg > 60000) drop(); else send({ t: 'ping' });
  }, 25000);
  connect();

  return {
    emit(topic, data) {
      let s;
      try { s = JSON.stringify(data === undefined ? null : data); } catch (e) { return Promise.reject({ code: 'invalid_argument' }); }
      if (bytes(s) > 4096) return Promise.reject({ code: 'invalid_argument', message: 'Nachricht zu groß' });
      if (!send({ t: 'emit', topic, data: JSON.parse(s) })) return Promise.reject({ code: 'unavailable', message: 'Keine Verbindung' });
      setTimeout(() => call(handlers[topic] || [], { topic, data: JSON.parse(s), peer: myId, by: null, isMe: true, sameTab: true, kind: 'viewer', guest: false }), 0);
      return Promise.resolve();
    },
    on(topic, fn) { const list = (handlers[topic] = handlers[topic] || []); list.push(fn); return off(list, fn); },
    presence(patch) {
      const cur = Object.assign({}, mine);
      for (const k in patch || {}) { if (patch[k] === null) delete cur[k]; else cur[k] = patch[k]; }
      if (bytes(JSON.stringify(cur)) > 4096) return Promise.reject({ code: 'invalid_argument' });
      mine = cur; setPeer(myId, cur);
      send({ t: 'presence', p: cur });
      notify([], [], [myId]);
      return Promise.resolve();
    },
    peers: snap,
    connected: () => ok,
    onPeers(fn) { peerFns.push(fn); setTimeout(() => fn({ peers: snap(), joined: snap(), left: [], updated: [] }), 0); return off(peerFns, fn); },
    onConnection(fn) { connFns.push(fn); setTimeout(() => fn(ok), 0); return off(connFns, fn); }
  };
}

async function initRoom() {
  let ns = null;
  if (CLAUDE_ROOM) {
    roomState = 'pending';
    try { ns = await window.claude.use('room'); } catch (e) { ns = null; }
  } else if (HAS_ROOM) {
    try { ns = webRoom(`${ROOM_URL}/raum/${roomCode()}`); } catch (e) { ns = null; }
  }
  if (!ns) { roomState = 'none'; refreshRoomUI(); return; }
  roomNs = ns; roomState = 'ready';
  try {
    ns.onConnection(ok => {
      roomOk = ok;
      if (ok) { updatePresence(true); if (ui.mode === 'remote') askState(); if (on.role === 'host') oBroadcast(); }
      refreshRoomUI();
    }, () => { roomNs = null; roomState = 'none'; refreshRoomUI(); });
    ns.onPeers(ch => { peers = ch.peers || []; onPeersChange(ch); }, () => {});
    ns.on('act', onRemoteAct, () => {});
    ns.on('state', onStateMsg, () => {});
    ns.on('hello', onHello, () => {});
    ns.on('ostate', onOState, () => {});
    ns.on('rtc', onRtc, () => {});
  } catch (e) { roomNs = null; roomState = 'none'; refreshRoomUI(); return; }
  updatePresence(true);
  refreshRoomUI();
}
function refreshRoomUI() {
  if (ui.mode === 'setup') {
    if (prefs.tab === 'online') {
      const gs = $('#games-slot');
      if (gs && roomState === 'ready') gs.innerHTML = openGamesHTML(); else render();
    } else {
      const ph = $('#phone-hint'); if (ph) ph.textContent = phoneHint();
    }
    const js = $('#join-slot'); if (js) js.innerHTML = joinHTML();
  } else if (ui.mode === 'game') {
    const dot = $('#t-phone .dot');
    if (!!roomNs !== !!$('#t-phone')) render();
    else if (dot) dot.classList.toggle('on', hostConnected());
  } else if (ui.mode === 'remote') render();
}
function updatePresence(force) {
  if (!roomNs) return;
  let p;
  if (ui.mode === 'remote' && remote.game) p = { role: 'lead', game: remote.game };
  else if (ui.mode === 'game' && game) p = { role: 'screen', game: game.id, label: `Board ${game.dyn.bi + 1} von ${game.boards.length}, ${joinDe(game.teams.map(t => t.name))}`.slice(0, 300) };
  else if (on.role === 'host' && on.og) {
    const g = on.og;
    p = { role: 'ohost', game: g.id, pid: me.pid, label: `Quizabend von ${me.name || 'Gastgeber'}`.slice(0, 80), ph: g.ph === 'lobby' ? 'lobby' : 'running', np: g.pl.length, pids: g.pl.map(x => x.id),
      info: g.ph === 'lobby' ? '' : g.ph === 'gameEnd' ? 'Endstand' : `Board ${g.bi + 1} von ${g.boards.length}`, cam: cam.stream ? 1 : 0 };
  } else if (on.role === 'player' && on.gid) p = { role: 'oplayer', game: on.gid, pid: me.pid, name: me.name, cam: cam.stream ? 1 : 0 };
  else p = { role: 'idle' };
  const full = {};
  for (const k of PKEYS) full[k] = k in p ? p[k] : null;
  const s = JSON.stringify(full);
  if (!force && s === lastPresence) return;
  lastPresence = s;
  roomNs.presence(full).catch(() => {});
}
function roomScreens() {
  const seen = new Set();
  return peers.filter(p => !p.sameTab && p.kind !== 'agent' && p.presence && p.presence.role === 'screen' && typeof p.presence.game === 'string')
    .filter(p => !seen.has(p.presence.game) && seen.add(p.presence.game))
    .map(p => ({ game: p.presence.game, label: typeof p.presence.label === 'string' ? p.presence.label : '' }));
}
function hostConnected() {
  return !!(roomNs && game && peers.some(p => !p.sameTab && p.presence && p.presence.role === 'lead' && p.presence.game === game.id));
}
function onPeersChange(ch) {
  if (ui.mode === 'game' && game) {
    const newLead = [...(ch.joined || []), ...(ch.updated || [])].some(p => !p.sameTab && p.presence && p.presence.role === 'lead' && p.presence.game === game.id);
    if (newLead) broadcastState(true);
  }
  if (on.role === 'host' && on.og) {
    if (oProcessPeers()) oBump();
    else if ([...(ch.joined || []), ...(ch.updated || [])].some(p => p.presence && p.presence.role === 'oplayer' && p.presence.game === on.og.id)) oBroadcast();
  }
  if (ui.mode !== 'online') refreshRoomUI();
  camSync();
}
setInterval(() => { if (on.role === 'host' && on.og && oTick()) oBump(); }, 300);
setInterval(() => {
  if (on.role === 'host' && on.og) oBroadcast();
  if (on.role === 'player' && ui.mode === 'online' && !on.stale && Date.now() - on.at > 10000) { on.stale = true; render(); }
  if (ui.mode === 'game' && hostConnected()) broadcastState(true);
}, 3000);

/* ---------- Spielleitung am Handy (Spiel an einem Bildschirm) ---------- */
function viewState() {
  const g = game, d = g.dyn, b = g.boards[d.bi];
  const v = {
    ver: d.ver, ph: d.phase, bi: d.bi, bn: g.boards.length, pen: g.settings.penalty,
    cats: b.cats.map(c => c.name), res: d.res[d.bi],
    teams: g.teams.map((t, i) => ({ n: t.name, c: t.color, s: d.scores[i] })), turn: d.turn, cur: null
  };
  if (d.cur) {
    const c = d.cur, q = b.cats[c.c].qs[c.r];
    v.cur = { c: c.c, r: c.r, v: c.v, st: c.st, ans: c.ans, att: c.att, win: c.win, log: c.log, q: q.q, a: q.a, tl: c.tEnd ? Math.max(0, c.tEnd - Date.now()) : null, tt: g.settings.timer };
  }
  return v;
}
function broadcastState(force) {
  if (!roomNs || !roomOk || !game || ui.mode !== 'game') return;
  if (!force && !hostConnected()) return;
  roomNs.emit('state', { game: game.id, v: viewState() }).catch(() => {});
}
function sanitizeAction(a) {
  if (!a || typeof a !== 'object' || !game) return null;
  const int = (x, hi) => Number.isInteger(x) && x >= 0 && x <= hi;
  switch (a.type) {
    case 'pick': return int(a.c, 4) && int(a.r, 4) ? { type: 'pick', c: a.c, r: a.r } : null;
    case 'judge': return typeof a.ok === 'boolean' ? { type: 'judge', ok: a.ok } : null;
    case 'buzz': return int(a.t, game.teams.length - 1) ? { type: 'buzz', t: a.t } : null;
    case 'cancel': case 'reveal': case 'next': case 'nextBoard': case 'undo': return { type: a.type };
  }
  return null;
}
function onRemoteAct(msg) {
  if (!msg || msg.sameTab || ui.mode !== 'game' || !game) return;
  const d = msg.data;
  if (!d || typeof d !== 'object' || d.game !== game.id) return;
  if (d.ver !== game.dyn.ver) { broadcastState(true); return; }
  const a = sanitizeAction(d.a);
  if (a) { dispatch(a); broadcastState(true); }
}
function onHello(msg) {
  if (!msg || msg.sameTab || ui.mode !== 'game' || !game || !msg.data || msg.data.game !== game.id) return;
  broadcastState(true);
}
function joinRemote(gid) {
  if (!roomNs || !gid) return;
  remote.game = gid; remote.view = null; remote.at = 0; remote.pending = false;
  ui.mode = 'remote'; render(); updatePresence(true); askState();
}
function leaveRemote() { remote.game = null; remote.view = null; ui.mode = 'setup'; updatePresence(true); render(); }
function askState() { if (roomNs && remote.game) roomNs.emit('hello', { game: remote.game }).catch(() => {}); }
function onStateMsg(msg) {
  if (!msg || msg.sameTab || ui.mode !== 'remote') return;
  const d = msg.data;
  if (!d || d.game !== remote.game || !d.v || typeof d.v !== 'object' || typeof d.v.ver !== 'number') return;
  if (remote.view && d.v.ver < remote.view.ver) return;
  const changed = !remote.view || d.v.ver !== remote.view.ver || remote.pending || Date.now() - remote.at > 9000;
  remote.view = d.v; remote.at = Date.now(); remote.pending = false;
  remote.tEnd = d.v.cur && typeof d.v.cur.tl === 'number' ? Date.now() + d.v.cur.tl : null;
  if (changed) render();
}
function remoteSend(a) {
  if (!roomNs || !remote.game || !remote.view || remote.pending) return;
  remote.pending = true; render();
  roomNs.emit('act', { game: remote.game, ver: remote.view.ver, a }).catch(() => { remote.pending = false; render(); toast('Das hat nicht geklappt. Bitte nochmal tippen.'); });
  setTimeout(() => { if (remote.pending) { remote.pending = false; render(); askState(); } }, 2500);
}
setInterval(() => {
  if (ui.mode !== 'remote') return;
  const age = Date.now() - remote.at;
  if (age > 8000) askState();
  if (age > 12000 && age < 17000) render();
}, 5000);

function remoteHTML() {
  const v = remote.view, live = v && Date.now() - remote.at < 12000;
  const head = `<header class="r-head"><h1>Spielleitung</h1>
    <span class="r-status"><span class="lamp" style="--c:${live ? 'var(--good)' : 'var(--ink-dim)'}"></span>${!v ? 'Verbinde …' : live ? 'Verbunden' : 'Keine Verbindung'}</span>
    <span class="spacer"></span><button class="btn btn-plain btn-sm" data-act="remote-leave">Trennen</button></header>`;
  if (!v) return `<main class="remote">${head}<div class="r-card"><p>Warte auf den Spielbildschirm. Dort muss das Spiel geöffnet sein.</p></div></main>`;
  const dis = remote.pending ? 'disabled' : '';
  const teams = Array.isArray(v.teams) ? v.teams : [];
  const T = i => teams[i] || { n: '?', c: '#8a9a94', s: 0 };
  const cats = Array.isArray(v.cats) ? v.cats : [];
  let main = '';
  if (v.ph === 'board') {
    let grid = cats.map(c => `<span class="c">${esc(c)}</span>`).join('');
    for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
      const x = v.res && v.res[c] ? v.res[c][r] : null;
      if (x === null || x === undefined) grid += `<button class="t" data-act="pick" data-c="${c}" data-r="${r}" ${dis} aria-label="${esc(cats[c] || '')} für ${VALUES[r]}">${VALUES[r]}</button>`;
      else if (x >= 0) grid += `<span class="t won" style="--c:${col(T(x).c)}" title="${esc(T(x).n)}"></span>`;
      else grid += '<span class="t used">–</span>';
    }
    main = `<div class="r-card"><p class="r-line"><span class="lamp" style="--c:${col(T(v.turn).c)}"></span><span><b>${esc(T(v.turn).n)}</b> wählt eine Frage. Tippe sie hier an oder auf dem großen Bildschirm.</span></p><div class="r-board">${grid}</div></div>`;
  } else if (v.ph === 'question' && v.cur) {
    const c = v.cur, half = Math.round(c.v / 2), att = Array.isArray(c.att) ? c.att : [];
    let ctl = '';
    if (c.st === 'answer' || c.st === 'buzzAnswer') {
      const pen = (c.st === 'answer' || v.pen) ? half : 0, a = T(c.ans);
      ctl = `<p class="r-line"><span class="lamp" style="--c:${col(a.c)}"></span><span><b>${esc(a.n)}</b> ${c.st === 'answer' ? 'antwortet' : 'hat gebuzzert'}</span></p>
        <div class="r-actions two"><button class="btn btn-good btn-lg" data-act="judge" data-ok="1" ${dis}>Richtig +${c.v}</button><button class="btn btn-bad btn-lg" data-act="judge" data-ok="0" ${dis}>Falsch${pen ? ` −${pen}` : ''}</button></div>
        ${c.st === 'answer' && !(c.log || []).length ? `<button class="btn btn-plain" data-act="cancel" ${dis}>Zurück zum Board</button>` : ''}`;
    } else if (c.st === 'buzz') {
      const el = teams.map((_, i) => i).filter(i => !att.includes(i));
      ctl = `<p class="r-line"><span><b>Buzzer frei.</b> Welches Team war zuerst?</span></p>
        <div class="r-actions">${el.map(i => `<button class="btn btn-lg r-team" style="--c:${col(T(i).c)}" data-act="buzz" data-t="${i}" ${dis}>${esc(T(i).n)}</button>`).join('')}
        <button class="btn btn-plain" data-act="reveal" ${dis}>Niemand weiß es, Lösung zeigen</button></div>`;
    } else {
      ctl = `<p class="r-line"><span>${c.win >= 0 ? `<b>${esc(T(c.win).n)}</b> holt ${c.v} Punkte.` : 'Diesmal hat niemand die Punkte geholt.'}</span></p><button class="btn btn-brass btn-lg" data-act="next" ${dis}>Weiter</button>`;
    }
    main = `<div class="r-card"><p class="r-cat"><span>${esc(cats[c.c] || '')}</span><b>${esc(c.v)}</b></p>
      <p class="r-q">${esc(c.q)}</p>
      <div class="answer r-ans"><span class="lbl">Lösung</span><span class="val">${esc(c.a)}</span></div>
      ${remote.tEnd ? '<div class="timer"><div class="tbar"><i id="tbar-fill"></i></div><span class="tnum" id="tnum"></span></div>' : ''}
      ${logHTML(Array.isArray(c.log) ? c.log : [], teams)}
      ${ctl}</div>`;
  } else if (v.ph === 'boardEnd') {
    main = `<div class="r-card"><p>Board ${esc(v.bi + 1)} ist leer gespielt.</p><button class="btn btn-brass btn-lg" data-act="nextBoard" ${dis}>Weiter mit Board ${esc(v.bi + 2)}</button></div>`;
  } else if (v.ph === 'gameEnd') {
    main = '<div class="r-card"><p><b>Das Spiel ist vorbei.</b> Den Endstand siehst du unten und auf dem großen Bildschirm.</p></div>';
  }
  return `<main class="remote">${head}
    <p class="hint">Board ${esc(v.bi + 1)} von ${esc(v.bn)}</p>
    ${main}
    <div class="r-card r-scores">${teams.map(t => `<div class="r-score"><span class="lamp" style="--c:${col(t.c)}"></span><span class="n">${esc(t.n)}</span><span class="s">${fmt(Number(t.s) || 0)}</span></div>`).join('')}</div>
    <button class="btn btn-plain" data-act="undo" ${dis}>${icon('undo')} Letzten Schritt rückgängig</button>
  </main>`;
}

/* =========================================================
   Start
   ========================================================= */
function boot(data) {
  loadPrefs(); loadCustom(); loadBoards(); loadMe(); kiLoad();
  roomState = HAS_ROOM ? 'pending' : 'none';
  const so = store.get(K.online);
  if (so && so.id && so.host === me.pid && Array.isArray(so.pl) && so.ph !== 'gameEnd') savedOnline = so;
  if (data && data.og && data.og.host === me.pid) { oResume(data.og); }
  else if (data && data.game && data.game.dyn && data.mode === 'game') { game = data.game; ui.mode = 'game'; }
  else {
    const s = store.get(K.game);
    if (s && s.dyn && Array.isArray(s.teams) && Array.isArray(s.boards) && s.dyn.phase !== 'gameEnd') savedGame = s;
  }
  render();
  initRoom();
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ game, mode: ui.mode === 'game' ? 'game' : 'setup', og: on.role === 'host' ? on.og : null }));
}
/* Webapp im Netz: Offline-Speicher (sw.js). Nicht in Claude und nicht beim Öffnen per Doppelklick. */
if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.claude) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(boot);
else boot((hot && hot.data) || {});
})();
</script>
